apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyservice
  namespace: sl-ontoground
  labels:
    app: pyservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pyservice
  template:
    metadata:
      labels:
        app: pyservice
    spec:
      containers:
        - name: pyservice
          image: 192.168.0.100:5000/sl-ontoground-pyservice:v1
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40  # ~120MB transformer model load
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              # torch + MiniLM 로드 시 RSS ~1.5Gi → 1Gi 는 OOMKilled(exit137). 2Gi 로 상향.
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pyservice
  namespace: sl-ontoground
  labels:
    app: pyservice
spec:
  type: ClusterIP
  selector:
    app: pyservice
  ports:
    - name: http
      port: 8000
      targetPort: 8000
