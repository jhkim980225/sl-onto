apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: sl-ontoground
  labels:
    app: postgres
type: Opaque
stringData:
  # POSTGRES_PASSWORD is a placeholder. Set the real value in-cluster before apply, e.g.
  #   kubectl -n sl-ontoground create secret generic postgres-secret \
  #     --from-literal=POSTGRES_USER=slonto --from-literal=POSTGRES_DB=slonto \
  #     --from-literal=POSTGRES_PASSWORD='<real-strong-password>'
  # Do NOT commit a real password here.
  POSTGRES_PASSWORD: CHANGE_ME_IN_CLUSTER
  POSTGRES_USER: slonto
  POSTGRES_DB: slonto
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sl-ontoground
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16  # postgres:16 + pgvector extension prebuilt
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata  # postgres refuses a mount root with lost+found; use a subdir
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "slonto"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "slonto"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sl-ontoground
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
